admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }   # console d'admin Envoy

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }  # ← le front appelle ICI
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                stat_prefix: ingress_http
                codec_type: auto
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }               # toutes les requêtes
                          route:
                            cluster: chat_service              # → envoyées au cluster ci-dessous
                            max_stream_duration: { grpc_timeout_header_max: 0s }  # pas de timeout pour le streaming
                http_filters:
                  - name: envoy.filters.http.grpc_web        # ← LE filtre traducteur
                    typed_config:
                      api_type: envoy.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.router
                    typed_config:
                      api_type: envoy.filters.http.router.v3.Router
  clusters:
    - name: chat_service
      type: STATIC
      connect_timeout: 0.25s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}                  # le backend parle HTTP/2 (gRPC natif)
      load_assignment:
        cluster_name: chat_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 50052 }  # ← votre serveur Python
